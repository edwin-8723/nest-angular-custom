<div class="container py-4" style="max-width: 500px;">
  <h1 class="h3 mb-3">Inversiones por usuario</h1>

  <div class="input-group">
    <span class="input-group-text">ID de usuario</span>
    <input
      type="number"
      class="form-control"
      (input)="onUserIdChange($any($event.target).value)"
      (keydown.enter)="goToInversiones()"
    />
    <button type="button" class="btn btn-primary" (click)="goToInversiones()">
      Ver inversiones
    </button>
  </div>

  <p class="form-text mt-2">
    Tip: el usuario "Edwin" que creamos por API tiene id 1.
  </p>

  <a routerLink="/inversiones/todas" class="btn btn-link ps-0">Ver todas las inversiones</a>
</div>

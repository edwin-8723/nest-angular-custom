<div class="container py-4" style="max-width: 500px;">
  <h1 class="h3 mb-3">Nueva inversión (usuario {{ userId }})</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
      <label class="form-label">Tipo</label>
      <input type="text" class="form-control" formControlName="tipo" placeholder="fondo, accion, cripto..." />
      @if (form.controls.tipo.invalid && form.controls.tipo.touched) {
        <div class="form-text text-danger">El tipo es obligatorio.</div>
      }
    </div>

    <div class="mb-3">
      <label class="form-label">Monto</label>
      <input type="number" class="form-control" formControlName="monto" />
      @if (form.controls.monto.invalid && form.controls.monto.touched) {
        <div class="form-text text-danger">El monto debe ser mayor o igual a 0.</div>
      }
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Guardar</button>
      <a [routerLink]="['/users', userId, 'inversiones']" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
